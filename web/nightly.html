<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresh Eyes · Nightly README monitor</title>
<style>
:root{color-scheme:dark;--bg:#101719;--card:#192225;--text:#e6eeee;--muted:#b0c4c7;--line:#35484b;--accent:#8ad1ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,sans-serif}a{color:var(--accent)}header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;gap:20px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}button,.button{background:var(--accent);color:#102224;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.6;cursor:wait}h1{font-size:clamp(30px,5vw,48px);line-height:1.2;margin:24px 0 14px}h2{font-size:23px}.muted{color:var(--muted)}.card{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin:22px 0}.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 11px;border:1px solid var(--line);border-radius:30px;font-size:14px}.ok{color:#95e3b8}.bad{color:#ffb2a7}ul{padding-left:22px}#history{padding:0;list-style:none}#history li{padding:20px 0;border-top:1px solid var(--line)}code{font-size:.9em;overflow-wrap:anywhere}p{overflow-wrap:anywhere}.small{font-size:14px}.note{border-left:3px solid var(--accent);padding-left:16px}a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:4px}@media(max-width:500px){header,main{padding:18px}.card{padding:18px}.row{gap:10px}header{gap:12px}}
</style>
<header><a href="./">◉ Fresh Eyes</a><button id="language" type="button">中文</button></header>
<main>
  <p class="muted" data-t="eyebrow"></p><h1 data-t="title"></h1><p data-t="intro"></p>
  <section class="card"><div class="row"><span class="pill" data-t="schedule"></span><span class="pill" data-t="no_model"></span></div>
    <p><strong data-t="target"></strong> <a href="https://github.com/Textualize/rich-cli">Textualize/rich-cli</a></p>
    <p data-t="scope"></p><p class="muted small" data-t="delay"></p>
    <p class="note" id="scheduled-status" role="status"></p>
  </section>
  <section class="card" aria-labelledby="history-title"><div class="row"><h2 id="history-title" data-t="history"></h2><button id="refresh" type="button" data-t="refresh"></button></div>
    <p id="load-state" role="status"></p><ul id="history"></ul>
    <p><a id="workflow" data-t="all_runs"></a></p><p class="small muted" data-t="outcome_note"></p>
  </section>
  <section class="card"><h2 data-t="own_title"></h2><p data-t="own_scope"></p>
    <p><a class="button" href="https://github.com/johncat88425-del/fresh-eyes/blob/main/examples/nightly-readme.yml" data-t="template"></a></p>
    <p><a href="https://github.com/johncat88425-del/fresh-eyes/blob/main/docs/NIGHTLY_MONITORING.md" data-t="guide"></a></p>
    <p class="small muted" data-t="artifact"></p>
  </section>
</main>
<script type="module">
import {fetchHistory, WORKFLOW} from './nightly_history.js';
const words={en:{eyebrow:'CONTINUOUS README CHECKS',title:'Does the README still start?',intro:'A fresh installation and startup check every night, with an evidence trail you can inspect.',schedule:'Every day · 02:17 UK time',no_model:'No model or search calls',target:'Monitored public project:',scope:'Each run reads the current default-branch README, pins that commit, installs anew through PyPI-only egress, and runs its documented help/version command in a fresh non-root container. This does not verify functional output or attempt a repair.',delay:'GitHub schedules can be delayed or skipped. Public-repository schedules can stop after 60 days without repository activity.',schedule_unknown:'Scheduled-execution status is unavailable until public GitHub history loads.',pending:'No actual scheduled execution appears in the latest 20 runs yet. Manual checks below are validation, not proof that the nightly schedule has fired.',scheduled:'An actual scheduled execution is recorded below. Open its report to inspect the result.',history:'Execution history',refresh:'Refresh',loading:'Reading public GitHub workflow metadata…',empty:'No runs are recorded yet.',manual:'Manual validation',nightly:'Scheduled execution',other:'Other trigger',success:'Workflow completed successfully',failure:'Workflow failed — open the report for the cause',running:'Running',queued:'Queued',unknown:'Outcome unavailable',commit:'Fresh Eyes workflow commit',report:'Open run summary and reports',all_runs:'View all runs on GitHub →',outcome_note:'A red workflow alone does not diagnose a README fault. The report distinguishes startup failure, ambiguous instructions, unsupported projects and runner errors. Only a completed startup check makes this workflow green.',own_title:'Monitor your own repository',own_scope:'Copy the workflow template into your repository, pin the tested Fresh Eyes Action, and enable it on your default branch. It checks your own checkout. No provider account or key is needed.',template:'Open the workflow template',guide:'Setup, scope and troubleshooting →',artifact:'Reports include trigger, timestamps, resolved source commit, Fresh Eyes version, available dependency versions and SHA-256 checksums. Artifacts are retained for 90 days; downloading them may require GitHub sign-in. Workflow history is viewable separately.',not_ready:'The workflow history is not available yet. Open GitHub to check deployment.',rate_limited:'GitHub rate-limited this anonymous request. Open the workflow on GitHub; no key is requested.',error:'Could not load workflow history. Use the GitHub link below.'},zh:{eyebrow:'持續檢查 README',title:'今天照說明，還啟動得起來嗎？',intro:'每晚重新安裝與測試啟動，留下可以逐步核對的執行紀錄。',schedule:'每天 · 英國時間 02:17',no_model:'不呼叫模型或搜尋 API',target:'正在監控的公開專案：',scope:'每次讀取預設分支當時的 README 並固定 commit，在全新的非 root 容器內，透過只允許 PyPI 的網路重新安裝，再執行文件明示的 help／version 指令。這不代表功能輸出已驗證，也不會嘗試修補。',delay:'GitHub 排程可能延遲或略過；公開 repo 連續 60 天沒有活動時，排程可能停用。',schedule_unknown:'讀到 GitHub 公開紀錄後，才能確認排程是否真的執行。',pending:'最近 20 筆還沒有真正由排程觸發的紀錄。下面的手動檢查是驗收，不能當作夜間排程已執行的證明。',scheduled:'下方已有真正由排程觸發的紀錄，請打開該次報告核對結果。',history:'執行歷史',refresh:'重新整理',loading:'正在讀取 GitHub 公開的工作流程紀錄…',empty:'目前還沒有執行紀錄。',manual:'手動驗收',nightly:'排程執行',other:'其他觸發方式',success:'工作流程成功完成',failure:'工作流程失敗：請打開報告查看原因',running:'執行中',queued:'排隊中',unknown:'結果未知',commit:'Fresh Eyes 工作流程版本',report:'開啟該次摘要與報告',all_runs:'在 GitHub 查看全部紀錄 →',outcome_note:'紅燈本身不代表 README 有錯。報告會區分啟動失敗、指令不明確、不支援的專案與 runner 故障；只有真的完成啟動檢查才會讓這個流程亮綠燈。',own_title:'監控你自己的專案',own_scope:'把工作流程範本放進自己的 repo，固定已驗證的 Fresh Eyes Action 版本，並在預設分支啟用。它會檢查你自己的 checkout，不需要供應商帳號或金鑰。',template:'打開工作流程範本',guide:'設定方式、範圍與排錯 →',artifact:'報告保存觸發方式、時間、來源 commit、Fresh Eyes 版本、可取得的依賴版本與 SHA-256。Artifact 保留 90 天，下載可能需要登入 GitHub；工作流程歷史可另外查看。',not_ready:'還讀不到工作流程歷史，請到 GitHub 確認發布狀態。',rate_limited:'GitHub 限制了這次匿名讀取，請直接打開下方工作流程；不會要求你提供金鑰。',error:'無法載入工作流程歷史，請使用下方 GitHub 連結。'}};
const params=new URLSearchParams(location.search);let lang=params.get('lang')==='zh'?'zh':'en';let rows=null,error=null,busy=false;
const t=k=>words[lang][k];const $=id=>document.getElementById(id);
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=`Fresh Eyes · ${t('title')}`;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').textContent=lang==='zh'?'English':'中文';$('refresh').disabled=busy;$('workflow').href=WORKFLOW;
 $('load-state').textContent=busy?t('loading'):error?t(error in words.en?error:'error'):rows?.length?'':t('empty');
 $('scheduled-status').textContent=rows===null?t('schedule_unknown'):rows.some(r=>r.trigger==='scheduled')?t('scheduled'):t('pending');
 $('history').replaceChildren(...(rows||[]).map(r=>{const li=document.createElement('li');const line=document.createElement('div');line.className='row';line.append(text('span',t(r.trigger==='scheduled'?'nightly':r.trigger),'pill'),text('span',new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',dateStyle:'medium',timeStyle:'long'}).format(new Date(r.createdAt))));li.append(line,text('p',r.status==='completed'?r.conclusion==='success'?t('success'):r.conclusion?t('failure'):t('unknown'):t(r.status),r.conclusion==='success'?'ok':r.conclusion?'bad':'muted'));const a=document.createElement('a');a.href=r.url;a.textContent=t('report')+` · #${r.id}`;li.append(a);if(r.toolCommit)li.append(text('p',`${t('commit')}: ${r.toolCommit.slice(0,12)}`,'small muted'));return li;}));}
async function load(){busy=true;error=null;render();try{rows=await fetchHistory();}catch(e){rows=null;error=e.message;}finally{busy=false;render();}}
$('language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';render();});$('refresh').addEventListener('click',load);load();
</script>
</html>
