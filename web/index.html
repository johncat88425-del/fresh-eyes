<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Eyes</title>
<meta name="description" content="Fresh Eyes follows a README's first workflow in a clean Linux container, checks the real output against a human-approved acceptance check, and only counts a fix after it passes again from scratch. Built with NVIDIA Nemotron on Nebius Token Factory.">
<meta name="color-scheme" content="light dark">
<style>
/* Layout: sticky header with three destinations (Overview, Runs, Evaluation); each view is a page of cards.
   Status is always text plus colour; the accent (deep teal) is reserved for actions and navigation. */
:root {
  --bg: #f5f7f8; --surface: #ffffff; --surface-2: #eef2f3; --border: #d9e0e2; --border-strong: #b9c4c7;
  --text: #15201f; --muted: #56656a; --accent: #0f6d68; --accent-ink: #ffffff; --accent-soft: #e1f0ee;
  --ok: #1a7a47; --ok-bg: #e2f3e9; --info: #2c5fb5; --info-bg: #e6eefa;
  --warn: #8f5d00; --warn-bg: #fbf0d6; --bad: #b02a3b; --bad-bg: #fbe4e7; --bad-ink: #ffffff;
  --neutral: #5a646b; --neutral-bg: #eaeef0; --infra: #6a46b8; --infra-bg: #eee8fa;
  --code-bg: #101a1c; --code-text: #d5dee0; --add: #7fdcaa; --del: #ff919b;
  --radius: 12px; --radius-sm: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1415; --surface: #161d1f; --surface-2: #1d2628; --border: #2a3538; --border-strong: #3d4b4f;
    --text: #e6eceb; --muted: #97a6aa; --accent: #4fc1b6; --accent-ink: #062320; --accent-soft: #15302d;
    --ok: #5fd193; --ok-bg: #12301f; --info: #84a8ff; --info-bg: #182340;
    --warn: #efb84d; --warn-bg: #33270f; --bad: #ff7d8b; --bad-bg: #3a161c; --bad-ink: #2a0a0f;
    --neutral: #a8b3b8; --neutral-bg: #242d30; --infra: #b9a0ff; --infra-bg: #261d3d;
    --code-bg: #090d0e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }

/* header */
header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; min-height: 60px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; }
.brand .mark { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.brand .mark::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 3px var(--accent), 0 0 0 2px var(--surface); }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; }
nav.main a { color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; }
nav.main a:hover { color: var(--text); background: var(--surface-2); }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.bar .spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neutral); }
.conn.ok .dot { background: var(--ok); } .conn.down .dot { background: var(--bad); } .conn.down { color: var(--bad); font-weight: 600; }
.lang { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.banner { background: var(--bad); color: var(--bad-ink); }
.banner .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
.banner strong { font-weight: 700; }
.banner.info { background: var(--info-bg); color: var(--info); }

/* page */
main { padding-block: 28px 64px; display: grid; gap: 22px; }
main > * { min-width: 0; }
.crumb { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb a { color: var(--muted); }
h1 { font-size: 26px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; text-wrap: balance; }
h3 { font-size: 14px; margin: 0; }
.lead { color: var(--muted); margin: 0; max-width: 68ch; font-size: 16px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card > * { min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.stack { display: grid; gap: 14px; min-width: 0; align-content: start; }
.stack > * { min-width: 0; }
@media (max-width: 900px) { .grid-main { grid-template-columns: minmax(0, 1fr); } }

/* overview */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-text { display: grid; gap: 14px; padding-block: 6px; }
.hero-text h1 { font-size: 32px; }
@media (max-width: 520px) { .hero-text h1 { font-size: 26px; } }
ol.how { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 12px; }
ol.how li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
ol.how .n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
ol.how strong { display: block; }
ol.how span { color: var(--muted); font-size: 14px; }
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
a.case-card { color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
a.case-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgb(0 0 0 / .06); }
.case-card .name { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; }
.case-card .row2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* forms */
label.field { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input[type=text], select, textarea { width: 100%; font: inherit; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.row > .grow { flex: 1 1 200px; min-width: 0; }
.btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: var(--radius-sm); border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn:not([disabled]):hover { filter: brightness(1.06); }

/* status */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge code { font-size: 11px; opacity: .75; }
.badge.lg { font-size: 15px; padding: 5px 14px; }
.s-verified_fix, .s-already_passes, .s-approved, .s-passed, .s-ok { background: var(--ok-bg); color: var(--ok); }
.s-startup_only, .s-running, .s-queued, .s-info { background: var(--info-bg); color: var(--info); }
.s-needs_review, .s-needs_input, .s-development_reviewed, .s-draft, .s-manual_candidate, .s-warn { background: var(--warn-bg); color: var(--warn); }
.s-unresolved, .s-failed, .s-bad { background: var(--bad-bg); color: var(--bad); }
.s-unsupported, .s-none, .s-completed, .s-example, .s-neutral { background: var(--neutral-bg); color: var(--neutral); }
.s-infrastructure_error { background: var(--infra-bg); color: var(--infra); }
.notice { border-radius: var(--radius-sm); padding: 10px 14px; display: grid; gap: 3px; font-size: 14px; }
.notice p { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--info-bg); color: var(--info); }
.note-draft { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; max-width: 72ch; }
.note-draft p { margin: 0 0 10px; } .note-draft p:last-child { margin: 0; }
.notice.ok { background: var(--ok-bg); color: var(--ok); }
.notice.neutral { background: var(--neutral-bg); color: var(--neutral); }
.locked { display: grid; gap: 10px; padding: 14px; border-radius: var(--radius-sm); background: var(--ok-bg); }
.locked .title { color: var(--ok); font-weight: 700; display: flex; gap: 8px; align-items: center; }
textarea { resize: vertical; min-height: 4.5em; }
ol.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.history > li { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.correction { padding: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
.correction h3 { margin: 0; }

/* data */
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
pre { background: var(--code-bg); color: var(--code-text); padding: 10px 12px; border-radius: var(--radius-sm); overflow-x: auto; margin: 0; line-height: 1.45; white-space: pre; }
pre .add { color: var(--add); } pre .del { color: var(--del); }
ul.tight { margin: 0; padding-left: 18px; } ul.tight li { margin: 2px 0; }
details > summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
details > *:not(summary) { margin-top: 8px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* run */
.result-head { border-left: 6px solid var(--neutral); }
.result-head.r-verified_fix, .result-head.r-already_passes { border-left-color: var(--ok); }
.result-head.r-unresolved { border-left-color: var(--bad); }
.result-head.r-needs_review, .result-head.r-needs_input { border-left-color: var(--warn); }
.result-head.r-infrastructure_error { border-left-color: var(--infra); }
.result-head.r-startup_only, .result-head.r-none { border-left-color: var(--info); }
.result-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; }
.facts div { display: grid; gap: 1px; }
.facts .k { color: var(--muted); font-size: 12px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--info); font-weight: 600; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--info); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } a.case-card { transition: none; } }
ol.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
ol.timeline > li { position: relative; padding: 0 0 22px 38px; min-width: 0; }
ol.timeline > li::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 2px; background: var(--border); }
ol.timeline > li:last-child { padding-bottom: 0; } ol.timeline > li:last-child::before { display: none; }
.tl-dot { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tl-dot.passed { background: var(--ok-bg); color: var(--ok); } .tl-dot.failed { background: var(--bad-bg); color: var(--bad); }
.tl-dot.patch { background: var(--warn-bg); color: var(--warn); } .tl-dot.model { background: var(--info-bg); color: var(--info); font-size: 11px; } .tl-dot.other { background: var(--neutral-bg); color: var(--neutral); }
.tl-dot.round { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
ol.timeline > li.tl-round { padding-bottom: 16px; }
ol.timeline > li.tl-round > .tl-head { font-size: 15px; color: var(--accent); }
.s-example_two_round, .s-model { background: var(--info-bg); color: var(--info); }
.tl-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 28px; font-weight: 650; }
.tl-body { display: grid; gap: 12px; margin-top: 10px; min-width: 0; }
.tl-body > * { min-width: 0; }
.out-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }

/* evaluation */
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 6px 14px; border: 0; background: var(--surface); color: var(--text); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.metric-n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.cell { display: grid; gap: 2px; justify-items: start; }
.cell .meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.match-yes { color: var(--ok); font-weight: 700; } .match-no { color: var(--bad); font-weight: 700; }

footer { color: var(--muted); font-size: 13px; padding-block: 0 36px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 18px; }
footer a { color: var(--muted); }

/* ---- Dashboard layouts (B22). Each page uses the one that fits its content; all collapse to one column on phones. ---- */
/* ① primary + secondary: one large module, small tiles to its right and below */
.lay-primary { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.lay-primary > .primary { grid-row: span 2; }
.lay-primary > .tiles.below { grid-column: 1 / -1; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
.tiles.below { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; align-content: start; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .s { font-size: 12px; color: var(--muted); }
a.tile { color: inherit; text-decoration: none; } a.tile:hover { border-color: var(--accent); }
@media (max-width: 900px) { .lay-primary { grid-template-columns: minmax(0, 1fr); } .lay-primary > .primary { grid-row: auto; } }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow .step { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); flex: 1 1 130px; min-width: 0; align-content: start; }
.flow .step .t { font-size: 12px; color: var(--muted); }
.flow .arrow { color: var(--muted); align-self: center; }
@media (max-width: 520px) { .flow .arrow { display: none; } }
/* ② horizontal bands: overview numbers, then comparison, then detail */
.band { display: grid; gap: 12px; }
.band-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 0; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(130px, 250px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; }
.meter { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
@media (max-width: 520px) { .bar-row { grid-template-columns: minmax(0, 1fr) auto; } .bar-row .meter { grid-column: 1 / -1; grid-row: 2; } }
/* ③ main column + sticky side rail */
.lay-rail { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
.lay-rail > .rail { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; }
@media (max-width: 900px) { .lay-rail { grid-template-columns: minmax(0, 1fr); } .lay-rail > .rail { position: static; max-height: none; overflow: visible; } }
.jump { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.jump a { text-decoration: none; color: var(--text); display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; }
.jump a:hover { background: var(--surface-2); }
.jump .linkish { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; width: 100%; box-sizing: border-box; }
.jump .linkish:hover { background: var(--surface-2); } .jump .linkish:focus-visible { outline: 2px solid var(--accent); }
.jump .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--neutral); }
.jump .dot.passed { background: var(--ok); } .jump .dot.failed { background: var(--bad); } .jump .dot.round { background: var(--accent); }
/* ④ full canvas + floating panels in its corners */
.canvas { position: relative; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); padding: 124px 22px 112px; display: grid; gap: 16px; min-width: 0; }
.float { position: absolute; z-index: 1; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 6px 22px rgb(0 0 0 / .12); padding: 10px 14px; display: grid; gap: 4px; font-size: 13px; max-width: calc(50% - 28px); min-width: 0; }
.float .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
.float.tl { top: 14px; left: 14px; } .float.tr { top: 14px; right: 14px; } .float.bl { bottom: 14px; left: 14px; } .float.br { bottom: 14px; right: 14px; }
@media (max-width: 760px) { .canvas { padding: 14px; } .float { position: static; max-width: none; box-shadow: none; } }
.io-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.io { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; }
.io .arrow { align-self: center; color: var(--muted); font-size: 18px; }
.io .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
@media (max-width: 520px) { .io-grid { grid-template-columns: minmax(0, 1fr); } .io { grid-template-columns: minmax(0, 1fr); } .io .arrow { transform: rotate(90deg); justify-self: center; } }
/* ⑤ kanban: one column per result */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; }
a.kcard { color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; min-width: 0; }
a.kcard:hover { border-color: var(--accent); }
.kcard .row2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.klist { display: grid; gap: 8px; }
/* ⑥ time-axis swimlanes: one lane per case, one bar per run */
.lanes { display: grid; min-width: 0; }
.lane { display: grid; grid-template-columns: 190px minmax(0, 1fr); align-items: center; border-top: 1px solid var(--border); }
.lane-name { font-size: 13px; padding: 10px 10px 10px 0; overflow-wrap: anywhere; }
.track { position: relative; height: 46px; min-height: 46px; }
.track .lane-bar { position: absolute; top: 13px; height: 18px; border-radius: 6px; min-width: 10px; display: block; }
.track .lane-bar:hover, .track .lane-bar:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.lane-bar.r-ok { background: var(--ok); } .lane-bar.r-bad { background: var(--bad); } .lane-bar.r-warn { background: var(--warn); }
.lane-bar.r-info { background: var(--info); } .lane-bar.r-infra { background: var(--infra); } .lane-bar.r-neutral { background: var(--neutral); }
.axis { position: relative; height: 24px; margin-left: 190px; font-size: 11px; color: var(--muted); }
.axis span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; } .axis span:last-child { transform: translateX(-100%); }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .55; }
.band table td:first-child, .band table th:first-child { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 640px) { .lane { grid-template-columns: 100px minmax(0, 1fr); } .axis { margin-left: 100px; } }

/* WIN-6 AI repair path: one step per stage from the record; wraps to a vertical list on narrow screens. */
.ai-path .path { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ai-path .path li { display: grid; gap: 4px; align-content: start; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); }
.ai-path .path .m { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.ai-path .path .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.ai-path .p-ok .m { background: var(--ok-bg); color: var(--ok); }
.ai-path .p-bad .m { background: var(--bad-bg); color: var(--bad); }
.ai-path .p-stop .m { background: var(--warn-bg); color: var(--warn); }
.ai-path .p-skip { opacity: .7; }
.ai-path .p-skip .m { background: var(--neutral-bg); color: var(--neutral); }

/* B24 beginner front door (#/, #/start, #/answer, #/examples): one question and one main button per screen,
   text at least 18px, buttons at least 56px, every status a symbol plus a word, text contrast at least 7:1.
   Design and its checks: design/beginner/README.md. */
:root {
  --b-ok: #0f5530; --b-ok-bg: #e2f3e9; --b-bad: #8a1c2b; --b-bad-bg: #fbe4e7; --b-person: #6e4700; --b-person-bg: #fbf0d6;
  --b-run: #234d93; --b-run-bg: #e6eefa; --b-accent: #0b5c58; --b-soft: #ebf6f4; --b-muted: #3e4a4e; --b-focus: #b35a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --b-ok: #7fdca3; --b-ok-bg: #11301f; --b-bad: #ff9aa6; --b-bad-bg: #3a1519; --b-person: #f5c76a; --b-person-bg: #362806;
    --b-run: #9dbdf5; --b-run-bg: #16243d; --b-accent: #6cd3c9; --b-soft: #163633; --b-muted: #c3ccce; --b-focus: #ffb45c;
  }
}
body.simple { font-size: 20px; line-height: 1.6; --accent: var(--b-accent); --accent-soft: var(--b-soft); }
body.simple :focus-visible, .b-help :focus-visible { outline: 4px solid var(--b-focus); outline-offset: 3px; border-radius: 8px; }
.simple .conn { display: none; }
.simple .bar { min-height: 72px; }
.simple .brand { font-size: 20px; }
.simple .brand .mark { width: 36px; height: 36px; }
.simple nav.main { gap: 8px; }
.simple .lang, .b-chip {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 24px; border: 2px solid var(--border-strong);
  background: var(--surface); color: var(--text); font: inherit; font-size: 18px; font-weight: 600; text-decoration: none; cursor: pointer;
}
.b-chip:hover, .simple .lang:hover { border-color: var(--accent); }
.simple nav.main a.b-chip { color: var(--text); font-size: 18px; font-weight: 600; padding: 0 16px; border-radius: 24px; }
.simple nav.main a.b-chip:hover { background: var(--surface); }
@media (max-width: 560px) { .simple nav.main a.b-chip { display: none; } } /* the footer links the detailed view on phones */
.simple .banner .wrap { font-size: 18px; }
.simple .banner.info { background: var(--b-run-bg); color: var(--b-run); }
.simple footer, .simple footer a { font-size: 18px; color: var(--b-muted); }
.simple footer a { color: var(--accent); }
.simple #footer { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
.b-page { max-width: 1040px; padding: 32px 0 56px; }
.b-page h1 { font-size: 44px; line-height: 1.2; margin: 0 0 16px; letter-spacing: -0.01em; }
.b-page p { margin: 0 0 16px; max-width: 60ch; overflow-wrap: break-word; }
.b-lead { font-size: 24px; color: var(--b-muted); }
.b-note { color: var(--b-muted); }
.b-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 0 32px; border-radius: 16px;
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 22px; font-weight: 700;
  text-decoration: none; cursor: pointer;
}
.b-btn.secondary { background: var(--surface); color: var(--accent); }
.b-btn[aria-disabled="true"], .b-btn:disabled { background: var(--border); border-color: var(--border); color: var(--text); cursor: not-allowed; }
.b-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 28px; }
.b-nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.b-nav a { display: inline-flex; align-items: center; min-height: 48px; font-weight: 600; text-underline-offset: 4px; }
.b-quiet { display: inline-block; margin-top: 20px; font-size: 21px; font-weight: 600; text-underline-offset: 4px; }
.b-step-of { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0 0 8px !important; }
.b-steps { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 0 28px; }
.b-steps li { display: flex; align-items: center; gap: 10px; font-size: 18px; color: var(--b-muted); padding-right: 12px; }
.b-steps .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--border-strong); background: var(--surface); }
.b-steps [aria-current="step"] { color: var(--text); font-weight: 700; }
.b-steps [aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.b-steps .done .n { border-color: var(--accent); color: var(--accent); }
.b-hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; min-height: 48vh; }
.b-hero h1 { font-size: 52px; }
.b-art { width: 100%; max-width: 360px; }
.b-three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 48px 0 0; padding: 0; list-style: none; }
.b-three li, .b-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
.b-three .n { width: 56px; height: 56px; border-radius: 50%; background: var(--b-soft); color: var(--accent); display: grid; place-items: center; font-size: 26px; font-weight: 800; margin-bottom: 12px; }
.b-three strong { display: block; font-size: 22px; }
.b-choices { display: grid; gap: 16px; margin: 24px 0 0; padding: 0; border: 0; min-width: 0; }
.b-choice { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; align-items: center; min-height: 120px; padding: 20px 24px; border-radius: 20px; border: 3px solid var(--border); background: var(--surface); cursor: pointer; }
.b-choice input { width: 32px; height: 32px; margin: 0; accent-color: var(--accent); }
.b-choice .name { display: block; font-size: 26px; font-weight: 700; }
.b-choice .what { display: block; color: var(--b-muted); }
.b-choice .tag { display: block; margin-top: 8px; }
.b-choice:has(input:checked) { border-color: var(--accent); background: var(--b-soft); }
.b-hint { font-size: 18px; color: var(--b-muted); margin-top: 12px !important; }
.b-io { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 20px; align-items: stretch; margin: 24px 0; }
.b-arrow { align-self: center; font-size: 40px; color: var(--accent); }
.b-label { font-size: 18px; font-weight: 700; color: var(--b-muted); margin-bottom: 8px; }
.b-paper { background: var(--surface); border: 2px dashed var(--border-strong); border-radius: 16px; padding: 20px; font-size: 20px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: var(--text); }
.b-paper.b-flat { border-style: solid; }
.b-rendered { background: var(--surface); border: 2px solid var(--border-strong); border-radius: 16px; padding: 20px; height: 100%; }
.b-rendered .b-h { font-size: 36px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
.b-rendered p { margin: 0 !important; }
.b-status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 19px; }
.b-status.b-ok, .b-ok { background: var(--b-ok-bg); color: var(--b-ok); }
.b-status.b-bad, .b-bad { background: var(--b-bad-bg); color: var(--b-bad); }
.b-status.b-person, .b-person { background: var(--b-person-bg); color: var(--b-person); }
.b-status.b-run, .b-run { background: var(--b-run-bg); color: var(--b-run); }
.b-status.b-plain, .b-plain { background: var(--b-soft); color: var(--accent); }
.b-mark { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 20px; }
.b-mark .b-status { white-space: nowrap; }
.b-big { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-size: 60px; font-weight: 800; }
.b-diff { border-radius: 16px; overflow: hidden; border: 2px solid var(--border); margin: 20px 0; font-family: var(--mono); font-size: 22px; }
.b-diff div { padding: 14px 20px; overflow-wrap: anywhere; }
.b-diff .old { background: var(--b-bad-bg); color: var(--b-bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.b-diff .new { background: var(--b-ok-bg); color: var(--b-ok); font-weight: 700; }
.b-diff .sign { display: inline-block; width: 1.4em; }
.b-page details { margin-top: 28px; border: 2px solid var(--border); border-radius: 16px; background: var(--surface); }
.b-page details > summary { list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; font-size: 21px; font-weight: 700; color: var(--accent); }
.b-page details > summary::-webkit-details-marker { display: none; }
.b-page details > summary::before { content: "+"; font-size: 28px; width: 24px; }
.b-page details[open] > summary::before { content: "–"; }
.b-page details > :not(summary) { padding: 0 24px 24px; }
.b-tech, .b-tech p { font-size: 18px; color: var(--b-muted); }
.b-tech code { font-size: 16px; overflow-wrap: anywhere; color: var(--text); }
.b-timeline { list-style: none; margin: 0; padding: 0; }
.b-timeline li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.b-timeline li:first-child { border-top: 0; }
.b-timeline .m { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.b-timeline .s { display: block; color: var(--b-muted); font-size: 18px; }
.b-stages { list-style: none; padding: 0; margin: 28px 0; display: grid; gap: 14px; }
.b-stages li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; align-items: center; padding: 18px 22px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); font-size: 22px; }
.b-stages .m { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 3px solid var(--border-strong); color: var(--b-muted); }
.b-stages li.now { border-color: var(--b-run); }
.b-stages li.now .m { border-color: var(--b-run); border-top-color: transparent; animation: b-spin 1.2s linear infinite; }
.b-stages li.done .m { background: var(--b-ok-bg); border-color: var(--b-ok-bg); color: var(--b-ok); }
@keyframes b-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .b-stages li.now .m { animation: none; border-top-color: var(--b-run); } }
.b-meter { height: 14px; border-radius: 7px; background: var(--border); overflow: hidden; }
.b-meter span { display: block; height: 100%; background: var(--accent); }
.b-rows { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 16px; }
.b-rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 22px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
.b-rows .name { display: block; font-size: 24px; font-weight: 700; }
.b-rows .what { display: block; color: var(--b-muted); margin: 4px 0 10px; }
.b-rows .b-btn { min-height: 56px; padding: 0 24px; font-size: 20px; }
dialog.b-help { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 0; border-radius: 24px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); font-size: 20px; line-height: 1.6; }
dialog.b-help::backdrop { background: rgba(10, 15, 15, .6); }
dialog.b-help .inner { padding: 32px; }
dialog.b-help h2 { font-size: 30px; margin: 0 0 12px; }
dialog.b-help h3 { font-size: 24px; margin: 20px 0 8px; }
.b-picture { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg); border-radius: 16px; padding: 16px; margin: 16px 0; text-align: center; font-size: 18px; }
.b-legend { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
@media (max-width: 760px) {
  .b-page { padding: 20px 0 48px; }
  .b-page h1, .b-hero h1 { font-size: 36px; }
  .b-lead { font-size: 21px; }
  .b-hero { grid-template-columns: 1fr; min-height: 0; gap: 16px; }
  .b-art { max-width: 240px; }
  .b-three { grid-template-columns: 1fr; }
  .b-btn { width: 100%; }
  .b-io { grid-template-columns: minmax(0, 1fr); }
  .b-io .b-arrow { transform: rotate(90deg); justify-self: center; }
  .b-rows li { grid-template-columns: minmax(0, 1fr); }
  .b-steps li .t { display: none; }
  .b-steps li[aria-current="step"] .t { display: inline; }
  .b-big { width: 80px; height: 80px; font-size: 46px; }
  .b-picture { flex-direction: column; }
  .b-picture .b-arrow { transform: rotate(90deg); }
  dialog.b-help .inner { padding: 20px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span>Fresh Eyes</a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="spacer"></div>
    <span class="conn" id="conn"></span>
    <button class="lang" id="lang" type="button"></button>
  </div>
</header>
<div id="banner"></div>
<main class="wrap" id="view"></main>
<footer><div class="wrap" id="footer"></div></footer>
<script type="module" src="app.js"></script>
</body>
</html>
