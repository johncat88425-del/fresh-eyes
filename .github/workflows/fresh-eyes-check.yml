# Manual dispatch only. No issue trigger, comments, secrets, or model calls.
# Standard public-repository runners only; the untrusted-code job has read permission.
name: Fresh Eyes check

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: Public GitHub repository URL (https://github.com/owner/repo)
        required: true
      commit:
        description: Optional full 40-character commit
        required: false

permissions: {}

concurrency:
  group: fresh-eyes-public-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find the source (release archive, or the source tree itself)
        run: |
          if [ -d src/fresh_eyes ]; then
            echo "SRC=." >> "$GITHUB_ENV"
          elif [ -f fresh-eyes-source.zip ]; then
            python3 -m zipfile -e fresh-eyes-source.zip source
            cp scripts/github-check.py source/fresh-eyes/scripts/github-check.py
            echo "SRC=source/fresh-eyes" >> "$GITHUB_ENV"
          else
            printf 'No runnable source found.\n' >&2
            exit 1
          fi
      - name: Pull the pinned Python image
        run: docker pull python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
      - name: Follow the README in a clean container
        env:
          REQUEST_REPO: ${{ inputs.repo_url }}
          REQUEST_COMMIT: ${{ inputs.commit }}
        run: python3 -I "$SRC/scripts/github-check.py" check --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-eyes-result
          path: result/
          if-no-files-found: ignore
          retention-days: 14

  # Manual runs: the reply goes to the job summary only; nothing is posted anywhere.
  summary:
    needs: check
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find the source (release archive, or the source tree itself)
        run: |
          if [ -d src/fresh_eyes ]; then
            echo "SRC=." >> "$GITHUB_ENV"
          elif [ -f fresh-eyes-source.zip ]; then
            python3 -m zipfile -e fresh-eyes-source.zip source
            cp scripts/github-check.py source/fresh-eyes/scripts/github-check.py
            echo "SRC=source/fresh-eyes" >> "$GITHUB_ENV"
          else
            printf 'No runnable source found.\n' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fresh-eyes-result
          path: result
      - name: Write the job summary
        run: |
          if [ -f result/result.json ]; then
            python3 -I "$SRC/scripts/github-check.py" comment result/result.json >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ⚠️ Our runner failed\n\nThe check did not produce a result. This says nothing about the README.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

