# Daily installation/startup monitoring only. No provider secrets, models or repairs.
name: Nightly README monitor
on:
  schedule:
    - cron: '17 2 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions: {}
concurrency:
  group: fresh-eyes-nightly-readme
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Check the current rich-cli README in a fresh container
        run: >-
          python3 -I scripts/nightly-check.py
          --repo-url https://github.com/Textualize/rich-cli
          --out monitor-report
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve each run's evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: nightly-readme-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-report/
          if-no-files-found: error
          retention-days: 90
